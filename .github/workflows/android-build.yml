name: Android Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

            - name: Install flutter_rust_bridge_codegen
        run: |
          # Используем официальный установщик binstall, защищенный от битых ссылок
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          # Убеждаемся, что binstall доступен в системе и запускаем установку кодогенератора моста
          $HOME/.cargo/bin/cargo-binstall -y flutter_rust_bridge_codegen@2.0.0


      - name: Prepare Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Build Rust Bridge
        run: |
          chmod +x generate_bridge.sh
          ./generate_bridge.sh

      - name: Clean and Build APK
        run: |
          cd app_flutter
          # Сбрасываем старый кэш сборщика, который хранит метаданные v1 embedding
          flutter clean
          flutter pub get
          # Собираем только для arm64, чтобы ускорить процесс и избежать ошибок линковки других архитектур
          flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: boombapdap-apk
          path: app_flutter/build/app/outputs/flutter-apk/app-release.apk

