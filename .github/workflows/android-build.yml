name: Android Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install flutter_rust_bridge_codegen
        run: |
          # Используем binstall для мгновенной установки бинарника вместо долгой компиляции
          curl -L https://github.com/cargo-bins/cargo-binstall/releases/latest/download/cargo-binstall-x86_64-unknown-linux-musl.tgz | tar -xvzf -
          ./cargo-binstall -y flutter_rust_bridge_codegen@2.0.0

      - name: Prepare Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Flutter Pub Get
        run: |
          cd app_flutter
          flutter pub get

      - name: Build Rust Bridge
        run: |
          chmod +x generate_bridge.sh
          ./generate_bridge.sh

      - name: Build APK
        run: |
          cd app_flutter
          # Собираем только для arm64, чтобы ускорить процесс и избежать ошибок линковки других архитектур
          flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: boombapdap-apk
          path: app_flutter/build/app/outputs/flutter-apk/app-release.apk
